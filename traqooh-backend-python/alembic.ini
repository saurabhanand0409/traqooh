# Alembic config. Migrations run automatically at app start-up (db_migrate.upgrade_to_head,
# called from main.py), so nobody has to run them by hand on Render.
# To run manually from this folder:  alembic upgrade head   (uses DATABASE_URL)
# To add a migration:                alembic revision -m "what it does"
[alembic]
script_location = migrations
