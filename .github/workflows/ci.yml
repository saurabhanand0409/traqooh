name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traqooh-backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: traqooh-backend-python/requirements.txt
      - run: pip install -r requirements.txt
      # Uses its own SQLite file; no secrets or network needed.
      - run: python tests/smoke_test.py
        env:
          JOB_WORKER: "off"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traqooh-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: traqooh-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
